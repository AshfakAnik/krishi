name: Build Android APK

on:
  push:
      branches: [main]
        pull_request:
            branches: [main]
              workflow_dispatch:

              jobs:
                build:
                    runs-on: ubuntu-latest

                        steps:
                              - name: Checkout repository
                                      uses: actions/checkout@v4

                                            - name: Set up Java
                                                    uses: actions/setup-java@v4
                                                            with:
                                                                      distribution: temurin
                                                                                java-version: '17'

                                                                                      - name: Set up Flutter
                                                                                              uses: subosito/flutter-action@v2
                                                                                                      with:
                                                                                                                channel: stable

                                                                                                                      - name: Install dependencies
                                                                                                                              run: flutter pub get

                                                                                                                                    - name: Build APK
                                                                                                                                            run: flutter build apk --release

                                                                                                                                                  - name: Upload APK
                                                                                                                                                          uses: actions/upload-artifact@v4
                                                                                                                                                                  with:
                                                                                                                                                                            name: krishi-release-apk
                                                                                                                                                                                      path: build/app/outputs/flutter-apk/app-release.apknamenamenamename