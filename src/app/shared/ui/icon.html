<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 20 20"
  fill="none"
  stroke="currentColor"
  stroke-width="1.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  @switch (name()) {
    @case ('tag') {
      <path d="M10.5 2.5H16a1.5 1.5 0 0 1 1.5 1.5v5.5L9 18 2 11l8.5-8.5Z" />
      <circle cx="13.6" cy="6.4" r="1.1" />
    }
    @case ('truck') {
      <path d="M2 5.5h9v8H2z" />
      <path d="M11 8h3.5L18 11v2.5h-7" />
      <circle cx="5.5" cy="15.5" r="1.6" />
      <circle cx="14" cy="15.5" r="1.6" />
    }
    @case ('ship') {
      <path d="M3 11l7-2.5 7 2.5-1.6 5.5H4.6L3 11Z" />
      <path d="M10 8.5V3.5M6.5 6h7" />
    }
    @case ('gauge') {
      <path d="M3.5 15a8 8 0 1 1 13 0" />
      <path d="M10 12.5 13.5 8" />
      <circle cx="10" cy="13" r="1.2" />
    }
    @case ('layers') {
      <path d="M10 2.5 17.5 6 10 9.5 2.5 6 10 2.5Z" />
      <path d="M2.5 10 10 13.5 17.5 10" />
      <path d="M2.5 13.5 10 17 17.5 13.5" />
    }
    @case ('droplet') {
      <path d="M10 2.5c3 3.6 5 6.1 5 8.4a5 5 0 0 1-10 0c0-2.3 2-4.8 5-8.4Z" />
    }
    @case ('box') {
      <path d="M2.5 6.2 10 3l7.5 3.2-7.5 3.3L2.5 6.2Z" />
      <path d="M2.5 6.2v7.6L10 17V9.5" />
      <path d="M17.5 6.2v7.6L10 17" />
    }
    @case ('check-shield') {
      <path d="M10 2.5 16.5 5v5c0 3.6-2.6 6.5-6.5 7.5C6.1 16.5 3.5 13.6 3.5 10V5L10 2.5Z" />
      <path d="M7.2 9.8 9.4 12l3.6-3.9" />
    }
    @case ('leaf') {
      <path d="M4 16c0-6 4.5-10 13-10 0 8-4.5 11-9 11-2.2 0-4-1-4-1Z" />
      <path d="M4.5 16.5C7 12.5 10 10 13.5 8.5" />
    }
    @case ('coins') {
      <ellipse cx="10" cy="5.5" rx="6" ry="2.5" />
      <path d="M4 5.5v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4" />
      <path d="M4 9.5v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4" />
    }
    @case ('users') {
      <circle cx="7.5" cy="7" r="2.6" />
      <path d="M2.5 16c0-2.6 2.2-4.4 5-4.4s5 1.8 5 4.4" />
      <path d="M13 5.2a2.6 2.6 0 0 1 0 5" />
      <path d="M14.5 11.9c1.8.5 3 1.9 3 4.1" />
    }
    @case ('sliders') {
      <path d="M3 6h10M17 6h0M3 14h6M13 14h4" />
      <circle cx="15" cy="6" r="1.8" />
      <circle cx="11" cy="14" r="1.8" />
    }
    @case ('grid') {
      <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
      <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
      <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
      <rect x="11.5" y="11.5" width="6" height="6" rx="1" />
    }
    @case ('menu') {
      <path d="M3 6h14M3 10h14M3 14h14" />
    }
    @case ('search') {
      <circle cx="9" cy="9" r="5.5" />
      <path d="M13.2 13.2 17.5 17.5" />
    }
    @case ('bell') {
      <path d="M6 8.5a4 4 0 0 1 8 0c0 3 1 4 1.5 4.5H4.5C5 12.5 6 11.5 6 8.5Z" />
      <path d="M8.4 15.5a1.8 1.8 0 0 0 3.2 0" />
    }
    @case ('chevron-right') {
      <path d="M8 5l5 5-5 5" />
    }
    @case ('chevron-down') {
      <path d="M5 8l5 5 5-5" />
    }
    @case ('arrow-left') {
      <path d="M16 10H4M9 5l-5 5 5 5" />
    }
    @case ('close') {
      <path d="M5 5l10 10M15 5 5 15" />
    }
    @case ('sort') {
      <path d="M7 4v12M7 16l-3-3M13 16V4M13 4l3 3" />
    }
    @case ('alert') {
      <path d="M10 3 18 16.5H2L10 3Z" />
      <path d="M10 8v3.5M10 13.6h0" />
    }
    @case ('shield') {
      <path d="M10 2.5 16.5 5v5c0 3.6-2.6 6.5-6.5 7.5C6.1 16.5 3.5 13.6 3.5 10V5L10 2.5Z" />
    }
    @case ('clock') {
      <circle cx="10" cy="10" r="7.2" />
      <path d="M10 5.8V10l3 1.8" />
    }
    @case ('calendar') {
      <rect x="3" y="4.5" width="14" height="12.5" rx="1.5" />
      <path d="M3 8.5h14M7 2.8v3.2M13 2.8v3.2" />
    }
    @case ('timer') {
      <circle cx="10" cy="11.5" r="6" />
      <path d="M10 8.5v3M7.8 2.8h4.4M15.6 6.4l1.2-1.2" />
    }
    @case ('receipt') {
      <path d="M4.5 2.5h11v15l-2-1.4-1.8 1.4-1.7-1.4-1.8 1.4-1.7-1.4-2 1.4v-15Z" />
      <path d="M7.5 7h5M7.5 10.2h5" />
    }
    @case ('scale') {
      <path d="M10 3v13M5.5 16.5h9M3 7h14M3 7l-1.6 4.2a2.8 2.8 0 0 0 5.2 0L5 7M15 7l-1.6 4.2a2.8 2.8 0 0 0 5.2 0L17 7" />
    }
    @case ('gift') {
      <rect x="2.8" y="7.5" width="14.4" height="9.7" rx="1.2" />
      <path d="M2 7.5h16M10 7.5v9.7" />
      <path d="M10 7.5S8.8 3 6.8 3a1.9 1.9 0 0 0 0 4.5M10 7.5S11.2 3 13.2 3a1.9 1.9 0 0 1 0 4.5" />
    }
    @case ('exit') {
      <path d="M12 3H4.5v14H12" />
      <path d="M9.5 10h8M14.5 6.8 17.8 10l-3.3 3.2" />
    }
    @case ('edit') {
      <path d="M3 14.2 13.4 3.8a1.8 1.8 0 0 1 2.6 2.6L5.6 16.8 2.4 17.4l.6-3.2Z" />
    }
    @case ('list') {
      <path d="M6.5 5.5h11M6.5 10h11M6.5 14.5h11M3 5.5h0M3 10h0M3 14.5h0" />
    }
    @default {
      <circle cx="10" cy="10" r="7" />
    }
  }
</svg>
