<ui-modal
  [heading]="heading()"
  description="Seasons are the windows a cultivation cycle must start inside. They may not overlap."
  (dismiss)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" id="season-form">
    <ui-form-field label="Name" for="name" [error]="errorFor('name')" hint="Such as Aman 2025.">
      <input
        id="name"
        type="text"
        formControlName="name"
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    <ui-form-field
      label="Year"
      for="year"
      [error]="errorFor('year')"
      hint="The harvest year. A Boro season spanning December to May belongs to the later one."
    >
      <input
        id="year"
        type="number"
        formControlName="year"
        class="tnum w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    <ui-form-field label="Opens on" for="startsOn" [error]="errorFor('startsOn')">
      <input
        id="startsOn"
        type="date"
        formControlName="startsOn"
        class="tnum w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    <ui-form-field label="Closes on" for="endsOn" [error]="errorFor('endsOn')">
      <input
        id="endsOn"
        type="date"
        formControlName="endsOn"
        class="tnum w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    <div class="mt-3 flex items-start gap-2">
      <input
        id="active"
        type="checkbox"
        formControlName="active"
        class="mt-0.5 rounded border-ink-300 text-brand-600 focus:ring-brand-500"
      />
      <label for="active" class="text-sm text-ink-700">
        Accepting new agreements and cycles
        <span class="block text-xs text-ink-500">
          Turn this off to close a season to new records without deleting it.
        </span>
      </label>
    </div>

    @if (attempted() && hasErrors()) {
      <ui-alert
        tone="warn"
        message="Some details still need fixing — see the fields marked above."
        [dismissible]="false"
      />
    }
  </form>

  <ng-container modalActions>
    <button
      type="button"
      (click)="closed.emit()"
      class="rounded-md border border-ink-200 px-3 py-2 text-sm text-ink-700 hover:border-ink-300"
    >
      Cancel
    </button>
    <button
      type="submit"
      form="season-form"
      [disabled]="saving()"
      class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:opacity-60"
    >
      {{ saving() ? 'Saving…' : 'Save season' }}
    </button>
  </ng-container>
</ui-modal>
