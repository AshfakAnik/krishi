<ui-modal
  heading="Open a processing batch"
  description="Drying, Pala stacking, threshing, machine processing or jute retting. Every step loses weight."
  (dismiss)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" id="process-form">
    <ui-form-field
      label="Harvest"
      for="p-harvestId"
      [error]="errorFor('harvestId')"
      hint="Only harvests with something left to process."
    >
      <select
        id="p-harvestId"
        formControlName="harvestId"
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      >
        <option value="">Select a harvest</option>
        @for (harvest of availableHarvests(); track harvest.id) {
          <option [value]="harvest.id">{{ harvestLabel(harvest.id) }}</option>
        }
      </select>
    </ui-form-field>

    <ui-form-field label="Process" for="p-process" [error]="errorFor('process')">
      <select
        id="p-process"
        formControlName="process"
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      >
        @for (process of processes; track process) {
          <option [value]="process">{{ processLabels[process] }}</option>
        }
      </select>
    </ui-form-field>

    <ui-form-field
      label="Started on"
      for="p-startedOn"
      [error]="errorFor('startedOn')"
      [hint]="inputHint()"
    >
      <input
        id="p-startedOn"
        type="date"
        formControlName="startedOn"
        class="tnum w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    <ui-form-field label="Note" for="p-note" [error]="errorFor('note')">
      <input
        id="p-note"
        type="text"
        formControlName="note"
        placeholder="Three days on the yard."
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    @if (attempted() && hasErrors()) {
      <ui-alert
        tone="warn"
        message="Some details still need fixing — see the fields marked above."
        [dismissible]="false"
      />
    }
  </form>

  <ng-container modalActions>
    <button
      type="button"
      (click)="closed.emit()"
      class="rounded-md border border-ink-200 px-3 py-2 text-sm text-ink-700 hover:border-ink-300"
    >
      Cancel
    </button>
    <button
      type="submit"
      form="process-form"
      [disabled]="saving()"
      class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:opacity-60"
    >
      {{ saving() ? 'Opening…' : 'Open batch' }}
    </button>
  </ng-container>
</ui-modal>
