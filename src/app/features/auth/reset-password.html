<main class="flex min-h-screen items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex items-center gap-2.5">
      <span class="text-brand-600"><ui-icon name="leaf" [size]="26" /></span>
      <div>
        <h1 class="text-xl font-semibold text-ink-900">Krishi</h1>
        <p class="text-sm text-ink-500">Smart Farming & Sharecropping Management</p>
      </div>
    </div>

    <div class="rounded-lg border border-ink-200 bg-white">
      <div class="border-b border-ink-100 px-4 py-3">
        <h2 class="text-sm font-semibold text-ink-800">Set a new password</h2>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="p-4">
        <ui-form-field label="New password" for="rp-password" [error]="errorFor('newPassword')">
          <input
            id="rp-password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
          />
        </ui-form-field>

        <div class="mb-2 flex items-center gap-2">
          <input
            id="rp-show-password"
            type="checkbox"
            [checked]="showPassword()"
            (change)="showPassword.set(!showPassword())"
            class="rounded border-ink-300 text-brand-600 focus:ring-brand-500"
          />
          <label for="rp-show-password" class="text-sm text-ink-700">Show password</label>
        </div>

        <ui-form-field label="Confirm new password" for="rp-confirm" [error]="errorFor('confirmPassword')">
          <input
            id="rp-confirm"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Re-enter the same password"
            class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
          />
        </ui-form-field>

        <div class="mb-2 flex items-center gap-2">
          <input
            id="rp-show-confirm"
            type="checkbox"
            [checked]="showConfirmPassword()"
            (change)="showConfirmPassword.set(!showConfirmPassword())"
            class="rounded border-ink-300 text-brand-600 focus:ring-brand-500"
          />
          <label for="rp-show-confirm" class="text-sm text-ink-700">Show password</label>
        </div>

        @if (error(); as message) {
          <ui-alert tone="bad" [message]="message" [dismissible]="false" />
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="mt-2 w-full rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:opacity-60"
        >
          {{ submitting() ? 'Saving…' : 'Reset password' }}
        </button>

        <a
          routerLink="/sign-in"
          class="mt-3 block text-center text-sm font-medium text-brand-600 hover:text-brand-700"
        >
          Back to sign in
        </a>
      </form>
    </div>
  </div>
</main>
