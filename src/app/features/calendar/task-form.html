<ui-modal
  heading="Add a calendar task"
  description="For the step the lifecycle template did not anticipate."
  (dismiss)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" id="task-form">
    <ui-form-field
      label="Cycle"
      for="t-cycleId"
      [error]="errorFor('cycleId')"
      hint="Only live cycles — nothing more is due on one that has finished."
    >
      <select
        id="t-cycleId"
        formControlName="cycleId"
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      >
        <option value="">Select a cycle</option>
        @for (cycle of availableCycles(); track cycle.id) {
          <option [value]="cycle.id">{{ cycleLabel(cycle.id) }}</option>
        }
      </select>
    </ui-form-field>

    <ui-form-field label="Stage" for="t-stage" [error]="errorFor('stage')">
      <select
        id="t-stage"
        formControlName="stage"
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      >
        @for (stage of stages; track stage) {
          <option [value]="stage">{{ stageLabels[stage] }}</option>
        }
      </select>
    </ui-form-field>

    <ui-form-field label="What has to be done" for="t-name" [error]="errorFor('name')">
      <input
        id="t-name"
        type="text"
        formControlName="name"
        placeholder="Third weeding pass"
        class="w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    <ui-form-field label="Due on" for="t-dueOn" [error]="errorFor('dueOn')">
      <input
        id="t-dueOn"
        type="date"
        formControlName="dueOn"
        class="tnum w-full rounded-md border border-ink-200 px-2.5 py-2 text-sm focus:border-brand-500 focus:outline-none"
      />
    </ui-form-field>

    @if (attempted() && hasErrors()) {
      <ui-alert
        tone="warn"
        message="Some details still need fixing — see the fields marked above."
        [dismissible]="false"
      />
    }
  </form>

  <ng-container modalActions>
    <button
      type="button"
      (click)="closed.emit()"
      class="rounded-md border border-ink-200 px-3 py-2 text-sm text-ink-700 hover:border-ink-300"
    >
      Cancel
    </button>
    <button
      type="submit"
      form="task-form"
      [disabled]="saving()"
      class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:opacity-60"
    >
      {{ saving() ? 'Adding…' : 'Add task' }}
    </button>
  </ng-container>
</ui-modal>
